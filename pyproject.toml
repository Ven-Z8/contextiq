[project]
name = "contextiq"
version = "0.1.0"
description = "Context-engineered agentic RAG for complex enterprise documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.72.0",
    "docling>=2.60.0",
    "fastapi>=0.121.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "qdrant-client[fastembed]>=1.14.2",
    "rich>=14.0.0",
    "structlog>=25.0.0",
    "tiktoken>=0.12.0",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
eval = [
    "huggingface_hub>=0.20",
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
    "pytest-cov>=7.1.0",
]
agent = [
    "langgraph>=1.0.0",
    "mcp>=1.20.0",
]
ui = [
    "gradio>=5.50.0",
]

[project.scripts]
contextiq = "contextiq.cli.app:app"
contextiq-api = "contextiq.api.main:run"
contextiq-ui = "contextiq.ui.gradio_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
