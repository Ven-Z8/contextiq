evals:
  - id: contract_clause_extraction
    type: deterministic
    question: What are the termination and intellectual property obligations?
    required_sources:
      - termination
      - intellectual property
    pass_conditions:
      - includes termination notice or cure period
      - includes ownership or assignment language
      - includes citations for both claims

  - id: unsupported_claim_refusal
    type: deterministic
    question: What penalty does this agreement impose for late payment?
    pass_conditions:
      - says the evidence is missing when not present
      - does not invent a penalty

  - id: risk_factor_synthesis
    type: llm_judge
    question: What are the top regulatory risks and what evidence supports each?
    pass_conditions:
      - groups risks by theme
      - cites every factual claim
      - separates document evidence from model interpretation

  - id: context_budget_report
    type: deterministic
    question: Inspect the context packet for a multi-section query.
    pass_conditions:
      - reports token budget
      - reports used tokens
      - reports dropped candidates
      - reports selected source ids
